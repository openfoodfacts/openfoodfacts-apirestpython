 name: Run release-please
 on:
   push:
     branches:
       - develop
 permissions:
  contents: write
  issues: write
  pull-requests: write
 jobs:
   release-please:
     runs-on: ubuntu-latest
     steps:
       - uses: googleapis/release-please-action@v5.0.0
         with:
           token: ${{ secrets.GITHUB_TOKEN }}
           release-type: simple
