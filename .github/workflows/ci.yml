# This is a basic workflow to help you get started with Actions

name: CI

permissions:
  contents: read

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the master branch
on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
    - uses: actions/checkout@v7.0.1
    - uses: actions/setup-python@v7.1.0
      with:
        python-version-file: '.python-version' # Single source of truth for Python version
        architecture: 'x64' # optional x64 or x86. Defaults to x64 if not specified
        cache: 'pip'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    # Runs a single command using the runners shell
    - name: Test with pytest
      run: |
        pytest || exit 0
  smoke:
    runs-on: ubuntu-latest
    needs: build
    services:
      mongodb:
        image: docker.io/library/mongo:4.4
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongo --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONGO_URL: mongodb://localhost:27017/off-fr
      PORT: 5000
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: actions/setup-python@v7.1.0
      with:
        python-version-file: '.python-version'
        architecture: 'x64'
        cache: 'pip'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Seed minimal fixture
      run: python -c "from pymongo import MongoClient; c=MongoClient('mongodb://localhost:27017/'); c['off-fr'].products.insert_many([{'code':'737628064502','product_name':'Stir-Fry Rice Noodles','created_t':1345799269},{'code':'3017620422003','product_name':'Nutella','brands':'Ferrero','created_t':1345799270}])"
    - name: Launch API in background
      run: nohup python runApiRESTServer.py > api.log 2>&1 & echo $! > api.pid
    - name: Smoke check
      run: |
        for i in $(seq 1 30); do curl -sf http://localhost:5000/ && break || sleep 2; done
        curl -sf http://localhost:5000/ | grep -q '"status": "OK"'
        curl -sf http://localhost:5000/product/737628064502 | grep -q 'Stir-Fry'
        curl -sf "http://localhost:5000/products?limit=1" | grep -q 'product_name'
    - name: Show API log on failure
      if: failure()
      run: cat api.log
